<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ورود</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:system-ui,Tahoma,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
.lg{width:min(320px,90vw);text-align:center}
h3{margin:0 0 14px;font-weight:600;font-size:1.15rem}
input{width:100%;padding:12px;border-radius:12px;border:1px solid #333;background:#111;color:#fff;font-size:1.1rem;text-align:center;letter-spacing:2px;text-transform:uppercase;outline:none}
input:focus{border-color:#888}
#e{min-height:1.4rem;margin:8px 0;color:#ff6b6b;font-size:.9rem}
button{width:100%;padding:12px;border:0;border-radius:12px;background:#fff;color:#000;font-size:1rem;font-weight:600;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:#fff;border:1px solid #444}
button.ghost:active{background:#111}
#n{font-size:5.5rem;font-weight:700;line-height:1;min-height:5.5rem;margin:6px 0 22px;font-variant-numeric:tabular-nums}
#n.pop{animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(1.4);opacity:.25}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<form class="lg" id="f" autocomplete="off">
  <h3>کد را وارد کنید</h3>
  <input id="c" dir="ltr" autocapitalize="characters" spellcheck="false" autocomplete="off" maxlength="64" autofocus>
  <div id="e"></div>
  <button type="submit">ورود</button>
</form>
<div class="lg" id="cd" hidden>
  <h3 id="st">در حال ورود...</h3>
  <div id="n"></div>
  <button type="button" id="x" class="ghost">لغو</button>
</div>
<script>
/* ---- تنظیمات ---- */
var ORIGIN = 'https://purple-butterfly-11d0.jhl73esyrq7gc7bo6lavuuio75qobewx.workers.dev'; // آدرس ورکر
var PROXY  = 'https://cors.tools/';                                                        // پروکسی
var ICON   = 'https://cdn.imgurl.ir/uploads/s89773_.png';                                  // آیکون برنامه
var BASE   = PROXY + ORIGIN;

var $ = function (i) { return document.getElementById(i); };
var form = $('f'), inp = $('c'), err = $('e'), cd = $('cd'), st = $('st'), num = $('n'), cancel = $('x');
var FA = '۰۱۲۳۴۵۶۷۸۹';

/* ---- ذخیره‌ی کد در کوکی (اگر مرورگر کوکی را نگه نداشت، مثل باز کردن فایل محلی، از localStorage استفاده می‌شود) ---- */
var SEC = location.protocol === 'https:' ? '; Secure' : '';
var store = {
  get: function () {
    var m = /(?:^|;\s*)c=([^;]*)/.exec(document.cookie);
    if (m) { try { return decodeURIComponent(m[1]); } catch (e) {} }
    try { return localStorage.getItem('c') || ''; } catch (e) { return ''; }
  },
  set: function (v) {
    document.cookie = 'c=' + encodeURIComponent(v) + '; Max-Age=31536000; Path=/; SameSite=Lax' + SEC;
    try { if (/(?:^|;\s*)c=/.test(document.cookie)) localStorage.removeItem('c'); else localStorage.setItem('c', v); } catch (e) {}
  },
  del: function () {
    document.cookie = 'c=; Max-Age=0; Path=/; SameSite=Lax' + SEC;
    try { localStorage.removeItem('c'); } catch (e) {}
  }
};

/* ---- نصب برنامه (PWA): manifest داخل همین فایل ساخته می‌شود و آیکون همان لینک است ---- */
function manifestUrl() {
  var u = location.href.split('#')[0].split('?')[0];
  var m = {
    id: u, name: 'مدرسه', short_name: 'مدرسه', start_url: u, scope: u.replace(/[^\/]*$/, ''), display: 'standalone', dir: 'rtl', lang: 'fa',
    background_color: '#000000', theme_color: '#000000',
    icons: [{ src: ICON, sizes: '192x192', type: 'image/png', purpose: 'any' }, { src: ICON, sizes: '512x512', type: 'image/png', purpose: 'any' }, { src: ICON, sizes: '512x512', type: 'image/png', purpose: 'maskable' }]
  };
  return 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(m));
}
function addLinks(doc) {
  [['manifest', manifestUrl()], ['icon', ICON], ['apple-touch-icon', ICON]].forEach(function (x) {
    var l = doc.createElement('link'); l.rel = x[0]; l.href = x[1]; if (x[0] !== 'manifest') l.setAttribute('referrerpolicy', 'no-referrer'); doc.head.append(l);
  });
}
var deferred = null;
function installUI() {
  if (!deferred || $('inst')) return;
  try { if (sessionStorage.getItem('noinst')) return; } catch (e) {}
  var b = document.createElement('div'); b.id = 'inst';
  b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:99999;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#1c1c24;color:#fff;border:1px solid #333;font:14px system-ui,Tahoma,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:92vw;direction:rtl';
  var s = document.createElement('span'); s.textContent = 'این برنامه را روی دستگاه نصب کنید';
  var i = document.createElement('button'); i.textContent = 'نصب';
  i.style.cssText = 'all:unset;cursor:pointer;padding:6px 14px;border-radius:10px;background:#fff;color:#000;font-weight:600';
  i.onclick = async function () { var d = deferred; deferred = null; b.remove(); try { d.prompt(); await d.userChoice; } catch (e) {} };
  var x = document.createElement('button'); x.textContent = '✕'; x.setAttribute('aria-label', 'بستن');
  x.style.cssText = 'all:unset;cursor:pointer;padding:4px 8px;color:#aaa';
  x.onclick = function () { try { sessionStorage.setItem('noinst', '1'); } catch (e) {} b.remove(); };
  b.append(s, i, x); document.body.append(b);
}
function onBip(e) { e.preventDefault(); deferred = e; installUI(); }
function onInstalled() { deferred = null; var b = $('inst'); if (b) b.remove(); }
addEventListener('beforeinstallprompt', onBip); addEventListener('appinstalled', onInstalled);
addLinks(document);

/* ---- این تابع داخل صفحه‌ی دریافتی تزریق می‌شود ----
   هر درخواست نسبی (مثل /api/...) را از راه پروکسی می‌فرستد (بدون هدر سفارشی تا preflight لازم نشود)
   و ثبت سرویس‌ورکر را خاموش می‌کند تا هیچ درخواست مستقیمی نرود.
   فقط آدرس‌های کامل http/https که مدیر در تنظیمات می‌گذارد (مثل عکس بالای صفحه) مستقیم بارگذاری می‌شوند. */
function shim(B, K) {
  var of = window.fetch.bind(window);
  window.fetch = function (u, o) {
    if (typeof u !== 'string' || u.charAt(0) !== '/' || u.charAt(1) === '/') return of(u, o);
    var url = B + u;
    if (u.indexOf('/api/') === 0) {
      o = Object.assign({}, o); var m = (o.method || 'GET').toUpperCase();
      url += (u.indexOf('?') < 0 ? '?' : '&') + 'c=' + encodeURIComponent(K) + '&_t=' + Date.now();
      if (m === 'PUT' || m === 'DELETE') { url += '&_m=' + m; m = 'POST'; }
      o.method = m; o.headers = { 'Content-Type': 'text/plain' }; delete o.credentials;
      if (m !== 'GET' && o.body === undefined) o.body = '{}';
    }
    return of(url, o);
  };
  try { Object.defineProperty(navigator, 'serviceWorker', { value: { register: function () { return Promise.resolve(); }, getRegistrations: function () { return Promise.resolve([]); } } }); } catch (e) {}
}

async function text(path) {
  var r = await fetch(BASE + path);
  if (!r.ok) throw new Error('asset ' + r.status);
  return r.text();
}
var local = function (h) { return h && h.charAt(0) === '/' && h.charAt(1) !== '/'; };

async function show(html, code) {
  var doc = new DOMParser().parseFromString(html, 'text/html'), jobs = [];
  doc.querySelectorAll('link[href]').forEach(function (l) {
    var h = l.getAttribute('href'); if (!local(h)) return;
    if (/stylesheet/i.test(l.rel)) jobs.push(text(h).then(function (t) { var s = doc.createElement('style'); s.textContent = t; l.replaceWith(s); }));
    else l.remove(); // manifest و آیکون خود ورکر لازم نیست
  });
  doc.querySelectorAll('script[src]').forEach(function (sc) {
    var h = sc.getAttribute('src'); if (!local(h)) return;
    jobs.push(text(h).then(function (t) { var s = doc.createElement('script'); s.textContent = t.replace(/<\/script/gi, '<\\/script'); sc.replaceWith(s); }));
  });
  await Promise.all(jobs);
  addLinks(doc);
  var sh = doc.createElement('script'); sh.textContent = '(' + shim.toString() + ')(' + JSON.stringify(BASE) + ',' + JSON.stringify(code) + ');';
  doc.head.insertBefore(sh, doc.head.firstChild);
  var out = '<!doctype html>' + doc.documentElement.outerHTML;
  document.open(); document.write(out); document.close();
  window.__go = function (c) { store.set(c); location.reload(); }; // بعد از تغییر کد مدیریت: با کد جدید دوباره وارد می‌شود
  addEventListener('beforeinstallprompt', onBip); addEventListener('appinstalled', onInstalled); installUI();
}

/* ---- ورود: ذخیره‌ی کد در کوکی ← شمارش معکوس ۳ تا ۱ (همزمان با ۳ ثانیه‌ی انتظار ورکر) با دکمه‌ی لغو ---- */
var run = 0;
function view(v) { form.hidden = v !== 'f'; cd.hidden = v !== 'c'; }
function tick(n) { num.textContent = FA.charAt(n); num.classList.remove('pop'); void num.offsetWidth; num.classList.add('pop'); }
function back(msg) { view('f'); err.textContent = msg || ''; inp.value = ''; inp.focus(); }

async function start(code) {
  var id = ++run, ctl = new AbortController(), left = 3, t;
  store.set(code);
  view('c'); st.textContent = 'در حال ورود...'; cancel.hidden = false; tick(3);
  t = setInterval(function () {
    if (id !== run) { clearInterval(t); return; }
    if (--left > 0) tick(left);
    else { clearInterval(t); cancel.hidden = true; num.textContent = ''; st.textContent = 'در حال بررسی...'; } // دکمه‌ی لغو فقط در شمارش معکوس است
  }, 1000);
  cancel.onclick = function () { run++; clearInterval(t); ctl.abort(); store.del(); back(''); };
  try {
    var r = await fetch(BASE + '/' + encodeURIComponent(code), { cache: 'no-store', signal: ctl.signal });
    if (id !== run) return;
    clearInterval(t);
    if (r.ok) { cancel.hidden = true; num.textContent = ''; st.textContent = 'در حال بارگذاری...'; await show(await r.text(), code); return; }
    if (r.status === 402) store.del();
    back(r.status === 402 ? 'کد اشتباه است' : 'خطا در پاسخ سرور (' + r.status + ')');
  } catch (e) { if (id === run) { clearInterval(t); back('اتصال به سرور برقرار نشد'); } }
}

form.onsubmit = function (ev) { ev.preventDefault(); var c = inp.value.trim(); if (c) start(c); else inp.focus(); };
var saved = store.get(); if (saved) start(saved); // کد ذخیره‌شده: ورود خودکار (با امکان لغو)
</script>
</body>
</html>
