
<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>ورود</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{
 background:#000;color:#fff;
 font-family:system-ui,Tahoma,"Segoe UI",sans-serif;
 display:flex;align-items:center;justify-content:center
}
.lg{width:min(320px,90vw);text-align:center}
h3{margin:0 0 14px;font-weight:600;font-size:1.15rem}
input{
 width:100%;padding:12px;border-radius:12px;
 border:1px solid #333;background:#111;color:#fff;
 font-size:1.1rem;text-align:center;
 letter-spacing:2px;text-transform:uppercase;outline:none
}
input:focus{border-color:#888}
#e{min-height:1.4rem;margin:8px 0;color:#ff6b6b;font-size:.9rem}
button{
 width:100%;padding:12px;border:0;border-radius:12px;
 background:#fff;color:#000;font-size:1rem;
 font-weight:600;cursor:pointer;font-family:inherit
}
button:disabled{opacity:.6;cursor:default}
button.ghost{background:transparent;color:#fff;border:1px solid #444}
button.ghost:active{background:#111}
#n{
 font-size:5.5rem;font-weight:700;line-height:1;
 min-height:5.5rem;margin:6px 0 22px;
 font-variant-numeric:tabular-nums
}
#n.pop{animation:pop .4s ease-out}
@keyframes pop{
 from{transform:scale(1.4);opacity:.25}
 to{transform:scale(1);opacity:1}
}
</style>
</head>

<body>

<form class="lg" id="f" autocomplete="off">
 <h3>کد را وارد کنید</h3>
 <input id="c" dir="ltr" autocapitalize="characters"
 spellcheck="false" autocomplete="off" maxlength="64" autofocus>
 <div id="e"></div>
 <button type="submit">ورود</button>
</form>

<div class="lg" id="cd" hidden>
 <h3 id="st">در حال ورود...</h3>
 <div id="n"></div>
 <button type="button" id="x" class="ghost">لغو</button>
</div>

<script>

/* =================================
   تنظیمات
================================= */

var ORIGIN = 'https://purple-butterfly-11d0.jhl73esyrq7gc7bo6lavuuio75qobewx.workers.dev';

var PROXY = 'https://cors.tools/';

var ICON = 'https://cdn.imgurl.ir/uploads/s89773_.png';

var BASE = PROXY + ORIGIN;

var ORIGIN_URL = new URL(ORIGIN);


/* =================================
   ابزارهای عمومی
================================= */

var $ = function(i){
 return document.getElementById(i);
};

var form = $('f');
var inp = $('c');
var err = $('e');
var cd = $('cd');
var st = $('st');
var num = $('n');
var cancel = $('x');

var FA = '۰۱۲۳۴۵۶۷۸۹';


/* =================================
   تبدیل آدرس به آدرس پروکسی
================================= */

function proxyURL(value, base){

 try{

  var u = new URL(value, base || ORIGIN + '/');

  // فقط درخواست‌های مربوط به سرور اصلی
  // به پروکسی منتقل می‌شوند.

  if(u.origin !== ORIGIN_URL.origin){
   return u.href;
  }

  return BASE + u.pathname + u.search + u.hash;

 }catch(e){

  return value;

 }

}


/* =================================
   ذخیره کد ورود
================================= */

var SEC = location.protocol === 'https:' ? '; Secure' : '';

var store = {

 get:function(){

  var m = /(?:^|;\s*)c=([^;]*)/.exec(document.cookie);

  if(m){

   try{
    return decodeURIComponent(m[1]);
   }catch(e){}

  }

  try{
   return localStorage.getItem('c') || '';
  }catch(e){

   return '';

  }

 },

 set:function(v){

  document.cookie =
   'c=' + encodeURIComponent(v) +
   '; Max-Age=31536000; Path=/; SameSite=Lax' + SEC;

  try{

   if(/(?:^|;\s*)c=/.test(document.cookie)){
    localStorage.removeItem('c');
   }else{
    localStorage.setItem('c',v);
   }

  }catch(e){}

 },

 del:function(){

  document.cookie =
   'c=; Max-Age=0; Path=/; SameSite=Lax' + SEC;

  try{
   localStorage.removeItem('c');
  }catch(e){}

 }

};


/* =================================
   پروکسی Fetch و XHR
================================= */

function shim(B,K){

 var nativeFetch = window.fetch.bind(window);

 var nativeOpen = XMLHttpRequest.prototype.open;
 var nativeSend = XMLHttpRequest.prototype.send;

 var nativeSetHeader = XMLHttpRequest.prototype.setRequestHeader;

 function apiInfo(url,method){

  var u;

  try{
   u = new URL(url,ORIGIN + '/');
  }catch(e){
   return null;
  }

  if(u.origin !== ORIGIN_URL.origin){
   return null;
  }

  if(!u.pathname.startsWith('/api/')){
   return null;
  }

  var m = (method || 'GET').toUpperCase();

  u.searchParams.set('c',K);
  u.searchParams.set('_t',Date.now());

  if(m === 'PUT' || m === 'DELETE'){

   u.searchParams.set('_m',m);
   m = 'POST';

  }

  return {
   url:proxyURL(u.href),
   method:m,
   api:true
  };

 }


 /* -------- Fetch -------- */

 window.fetch = function(input,options){

  options = options || {};

  var originalURL;
  var requestObject = input instanceof Request;

  if(requestObject){

   originalURL = input.url;

  }else{

   originalURL = String(input);

  }

  var target = proxyURL(originalURL);

  var method = options.method ||
   (requestObject ? input.method : 'GET');

  var api = apiInfo(originalURL,method);

  if(api){

   target = api.url;

   options = Object.assign({},options);

   options.method = api.method;

   options.headers = new Headers(options.headers || {});

   // برای جلوگیری از preflight غیرضروری
   options.headers.set('Content-Type','text/plain');

   options.credentials = 'omit';

   if(
    api.method !== 'GET' &&
    options.body === undefined &&
    !requestObject
   ){

    options.body = '{}';

   }

  }

  if(requestObject){

   var init = Object.assign({},options);

   var request = new Request(target,input);

   return nativeFetch(request,init);

  }

  return nativeFetch(target,options);

 };


 /* -------- XMLHttpRequest -------- */

 XMLHttpRequest.prototype.open = function(method,url){

  var original = String(url);

  var api = apiInfo(original,method);

  var target = api ? api.url : proxyURL(original);

  this.__proxyApi = !!api;
  this.__proxyMethod = api ? api.method : method;

  var args = Array.prototype.slice.call(arguments);

  args[0] = this.__proxyMethod;
  args[1] = target;

  return nativeOpen.apply(this,args);

 };


 XMLHttpRequest.prototype.send = function(body){

  if(this.__proxyApi){

   if(body == null && this.__proxyMethod !== 'GET'){
    body = '{}';
   }

   try{

    nativeSetHeader.call(
     this,
     'Content-Type',
     'text/plain'
    );

   }catch(e){}

  }

  return nativeSend.call(this,body);

 };

}


/* =================================
   اصلاح منابع HTML
================================= */

function local(h){

 return h &&
 h.charAt(0) === '/' &&
 h.charAt(1) !== '/';

}


function rewriteCSS(css,source){

 return css.replace(
  /url\(\s*(['"]?)(.*?)\1\s*\)/gi,
  function(match,q,url){

   if(!url || /^(data:|blob:|#)/i.test(url)){
    return match;
   }

   return 'url("' + proxyURL(url,source) + '")';

  }
 );

}


function rewriteSrcset(value,source){

 return value.split(',').map(function(part){

  var p = part.trim();

  if(!p)return p;

  var pieces = p.split(/\s+/);

  pieces[0] = proxyURL(pieces[0],source);

  return pieces.join(' ');

 }).join(', ');

}


function rewriteElement(el){

 var attrs = [
  'src',
  'href',
  'poster',
  'action',
  'data'
 ];

 attrs.forEach(function(name){

  if(!el.hasAttribute(name))return;

  var value = el.getAttribute(name);

  if(!value || value.startsWith('#'))return;

  if(
   name === 'href' &&
   el.tagName === 'A' &&
   !value.startsWith('/') &&
   !value.startsWith(ORIGIN)
  ){
   return;
  }

  el.setAttribute(
   name,
   proxyURL(value)
  );

 });


 if(el.hasAttribute('srcset')){

  el.setAttribute(
   'srcset',
   rewriteSrcset(el.getAttribute('srcset'),ORIGIN + '/')
  );

 }


 if(el.hasAttribute('style')){

  el.setAttribute(
   'style',
   rewriteCSS(
    el.getAttribute('style'),
    ORIGIN + '/'
   )
  );

 }

}


function rewriteDocument(doc){

 doc.querySelectorAll(
  '[src],[href],[poster],[action],[data],[srcset],[style]'
 ).forEach(rewriteElement);

}


/* =================================
   دریافت فایل از پروکسی
================================= */

async function text(path){

 var url = proxyURL(path);

 var r = await fetch(url,{
  cache:'no-store'
 });

 if(!r.ok){

  throw new Error('asset ' + r.status);

 }

 return r.text();

}


/* =================================
   PWA
================================= */

function manifestUrl(){

 var u = location.href.split('#')[0].split('?')[0];

 var m = {

  id:u,
  name:'مدرسه',
  short_name:'مدرسه',
  start_url:u,
  scope:u.replace(/[^\/]*$/,''),
  display:'standalone',
  dir:'rtl',
  lang:'fa',

  background_color:'#000000',
  theme_color:'#000000',

  icons:[
   {
    src:ICON,
    sizes:'192x192',
    type:'image/png',
    purpose:'any'
   },
   {
    src:ICON,
    sizes:'512x512',
    type:'image/png',
    purpose:'any'
   },
   {
    src:ICON,
    sizes:'512x512',
    type:'image/png',
    purpose:'maskable'
   }
  ]

 };

 return 'data:application/manifest+json;charset=utf-8,'+
 encodeURIComponent(JSON.stringify(m));

}


function addLinks(doc){

 [
  ['manifest',manifestUrl()],
  ['icon',ICON],
  ['apple-touch-icon',ICON]

 ].forEach(function(x){

  var l = doc.createElement('link');

  l.rel = x[0];
  l.href = x[1];

  if(x[0] !== 'manifest'){
   l.setAttribute('referrerpolicy','no-referrer');
  }

  doc.head.append(l);

 });

}


/* =================================
   نصب برنامه
================================= */

var deferred = null;

function installUI(){

 if(!deferred || $('inst'))return;

 try{

  if(sessionStorage.getItem('noinst'))return;

 }catch(e){}


 var b = document.createElement('div');

 b.id = 'inst';

 b.style.cssText =
 'position:fixed;left:50%;transform:translateX(-50%);' +
 'bottom:16px;z-index:99999;display:flex;align-items:center;' +
 'gap:10px;padding:10px 12px;border-radius:14px;' +
 'background:#1c1c24;color:#fff;border:1px solid #333;' +
 'font:14px system-ui,Tahoma,sans-serif;' +
 'box-shadow:0 8px 30px rgba(0,0,0,.5);' +
 'max-width:92vw;direction:rtl';


 var s = document.createElement('span');

 s.textContent = 'این برنامه را روی دستگاه نصب کنید';


 var i = document.createElement('button');

 i.textContent = 'نصب';

 i.style.cssText =
 'all:unset;cursor:pointer;padding:6px 14px;' +
 'border-radius:10px;background:#fff;color:#000;font-weight:600';


 i.onclick = async function(){

  var d = deferred;

  deferred = null;

  b.remove();

  try{

   d.prompt();

   await d.userChoice;

  }catch(e){}

 };


 var x = document.createElement('button');

 x.textContent = '✕';

 x.setAttribute('aria-label','بستن');

 x.style.cssText =
 'all:unset;cursor:pointer;padding:4px 8px;color:#aaa';


 x.onclick = function(){

  try{
   sessionStorage.setItem('noinst','1');
  }catch(e){}

  b.remove();

 };


 b.append(s,i,x);

 document.body.append(b);

}


function onBip(e){

 e.preventDefault();

 deferred = e;

 installUI();

}


function onInstalled(){

 deferred = null;

 var b = $('inst');

 if(b)b.remove();

}


addEventListener('beforeinstallprompt',onBip);

addEventListener('appinstalled',onInstalled);

addLinks(document);


/* =================================
   بارگذاری صفحه اصلی
================================= */

async function show(html,code){

 var doc = new DOMParser().parseFromString(
  html,
  'text/html'
 );

 var jobs = [];


 // CSS
 doc.querySelectorAll('link[href]').forEach(function(l){

  var h = l.getAttribute('href');

  var isCSS = /stylesheet/i.test(l.rel);

  if(!isCSS)return;

  var target = proxyURL(h);

  jobs.push(

   fetch(target)
    .then(function(r){

     if(!r.ok){
      throw new Error('CSS ' + r.status);
     }

     return r.text();

    })
    .then(function(t){

     var s = doc.createElement('style');

     s.textContent = rewriteCSS(
      t,
      new URL(h,ORIGIN + '/').href
     );

     l.replaceWith(s);

    })

  );

 });


 // JavaScript
 doc.querySelectorAll('script[src]').forEach(function(sc){

  var h = sc.getAttribute('src');

  var target = proxyURL(h);

  jobs.push(

   fetch(target)
    .then(function(r){

     if(!r.ok){
      throw new Error('JS ' + r.status);
     }

     return r.text();

    })
    .then(function(t){

     var s = doc.createElement('script');

     s.textContent = t.replace(
      /<\/script/gi,
      '<\\/script'
     );

     sc.replaceWith(s);

    })

  );

 });


 await Promise.all(jobs);


 // منابع HTML
 rewriteDocument(doc);


 // آیکون و manifest
 addLinks(doc);


 // نصب پروکسی قبل از اجرای اسکریپت‌های صفحه
 var sh = doc.createElement('script');

 sh.textContent =
 '(' + shim.toString() + ')(' +
 JSON.stringify(BASE) + ',' +
 JSON.stringify(code) + ');';

 doc.head.insertBefore(
  sh,
  doc.head.firstChild
 );


 // بازنویسی CSS و منابع پویا
 var observerCode = `
 (function(){

  var obs = new MutationObserver(function(records){

   records.forEach(function(record){

    if(record.type === 'attributes'){

     var el = record.target;

     if(el && el.nodeType === 1){
      rewriteElement(el);
     }

    }

    record.addedNodes.forEach(function(node){

     if(node.nodeType !== 1)return;

     rewriteElement(node);

     if(node.querySelectorAll){

      node.querySelectorAll(
       '[src],[href],[poster],[action],[data],[srcset],[style]'
      ).forEach(rewriteElement);

     }

    });

   });

  });

  obs.observe(document.documentElement,{
   childList:true,
   subtree:true,
   attributes:true,
   attributeFilter:[
    'src','href','poster','action','data','srcset','style'
   ]
  });

 })();
 `;


 // تابع‌های مورد نیاز برای MutationObserver
 var helper = doc.createElement('script');

 helper.textContent =
 'var proxyURL=' + proxyURL.toString() + ';' +
 'var rewriteCSS=' + rewriteCSS.toString() + ';' +
 'var rewriteSrcset=' + rewriteSrcset.toString() + ';' +
 'var rewriteElement=' + rewriteElement.toString() + ';' +
 'var ORIGIN=' + JSON.stringify(ORIGIN) + ';' +
 'var BASE=' + JSON.stringify(BASE) + ';' +
 'var ORIGIN_URL=new URL(ORIGIN);' +
 observerCode;

 doc.head.appendChild(helper);


 var out =
 '<!doctype html>' +
 doc.documentElement.outerHTML;


 document.open();

 document.write(out);

 document.close();


 window.__go = function(c){

  store.set(c);

  location.reload();

 };


 addEventListener('beforeinstallprompt',onBip);

 addEventListener('appinstalled',onInstalled);

 installUI();

}


/* =================================
   ورود
================================= */

var run = 0;


function view(v){

 form.hidden = v !== 'f';

 cd.hidden = v !== 'c';

}


function tick(n){

 num.textContent = FA.charAt(n);

 num.classList.remove('pop');

 void num.offsetWidth;

 num.classList.add('pop');

}


function back(msg){

 view('f');

 err.textContent = msg || '';

 inp.value = '';

 inp.focus();

}


/* =================================
   شروع ورود
================================= */

async function start(code){

 var id = ++run;

 var ctl = new AbortController();

 var left = 3;

 var t;


 store.set(code);

 view('c');

 st.textContent = 'در حال ورود...';

 cancel.hidden = false;

 tick(3);


 t = setInterval(function(){

  if(id !== run){

   clearInterval(t);

   return;

  }

  if(--left > 0){

   tick(left);

  }else{

   clearInterval(t);

   cancel.hidden = true;

   num.textContent = '';

   st.textContent = 'در حال بررسی...';

  }

 },1000);


 cancel.onclick = function(){

  run++;

  clearInterval(t);

  ctl.abort();

  store.del();

  back('');

 };


 try{

  var target =
   proxyURL('/' + encodeURIComponent(code));


  var r = await fetch(target,{

   cache:'no-store',

   signal:ctl.signal

  });


  if(id !== run)return;


  clearInterval(t);


  if(r.ok){

   cancel.hidden = true;

   num.textContent = '';

   st.textContent = 'در حال بارگذاری...';

   await show(await r.text(),code);

   return;

  }


  if(r.status === 402){

   store.del();

  }


  back(

   r.status === 402
    ? 'کد اشتباه است'
    : 'خطا در پاسخ سرور (' + r.status + ')'

  );


 }catch(e){

  if(id === run){

   clearInterval(t);

   back('اتصال به سرور برقرار نشد');

  }

 }

}


/* =================================
   رویداد ورود
================================= */

form.onsubmit = function(ev){

 ev.preventDefault();

 var c = inp.value.trim();

 if(c){

  start(c);

 }else{

  inp.focus();

 }

};


/* =================================
   ورود خودکار
================================= */

var saved = store.get();

if(saved){

 start(saved);

}

</script>

</body>
</html>
