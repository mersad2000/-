<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>بزودی...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #141e30, #243b55);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      color: white;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content {
      text-align: center;
      z-index: 10;
      padding: 20px;
      filter: drop-shadow(0 0 8px rgba(100, 200, 255, 0.7));
    }

    .soon {
      font-size: 3.4rem;
      font-weight: 900;
      margin-bottom: 20px;
      opacity: 0;
      animation: slideIn 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
    }

    .available {
      font-size: 2.2rem;
      font-weight: 700;
      opacity: 0;
      animation: slideIn 1.2s 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
      background: linear-gradient(to right, #a18cd1, #fbc2eb);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    @keyframes slideIn {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.95);
      }
      70% {
        transform: translateY(-10px) scale(1.02);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ریسپانسیو */
    @media (max-width: 600px) {
      .soon { font-size: 2.5rem; }
      .available { font-size: 1.7rem; }
    }

    @media (max-width: 400px) {
      .soon { font-size: 2.1rem; }
      .available { font-size: 1.4rem; }
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="content">
    <div class="soon">بزودی</div>
    <div class="available"> در دسترس قرار می‌گیره با امکانات بیشتر</div>
  </div>

  <script>
    // === Canvas: ذرات + خطوط نور (شبیه شبکه‌های فضایی) ===
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ذرات
    const particles = [];
    const particleCount = Math.min(100, Math.floor(window.innerWidth / 8));

    class Particle {
      constructor() {
        this.reset();
        this.speed = Math.random() * 0.8 + 0.2;
        this.size = Math.random() * 2 + 0.5;
        this.hue = Math.random() * 20 + 220; // آبی-بنفش
      }

      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
          this.reset();
        }
      }

      draw() {
        ctx.fillStyle = `hsla(${this.hue}, 80%, 70%, ${0.6})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // ایجاد ذرات
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // خطوط نور (اتصال ذرات نزدیک)
    function connectParticles() {
      const maxDist = 120;
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < maxDist) {
            const alpha = 1 - dist / maxDist;
            ctx.strokeStyle = `hsla(240, 90%, 70%, ${alpha * 0.3})`;
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
    }

    // لوپ انیمیشن
    function animate() {
      ctx.fillStyle = 'rgba(20, 30, 48, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      connectParticles();

      requestAnimationFrame(animate);
    }

    animate();
  </script>

</body>
</html>
